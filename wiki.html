<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Tecnica Fibra Ottica | Geo Fibra Collesalvetti</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/wiki.css">
    <script src="vendor/marked.min.js"></script>
</head>
<body class="geo-app wiki-page">
    <header class="site-header wiki-header">
        <a class="wiki-brand" href="wiki.html"><span class="brand-mark">GEO FIBRA</span> <strong>Wiki</strong></a>
        <div class="wiki-header-actions">
            <button type="button" id="btn-toggle-sidebar" class="ui-button" aria-controls="wiki-sidebar" aria-expanded="false"><span class="emoji" aria-hidden="true">📖</span> Indice</button>
            <a href="index.html" class="ui-button"><span class="emoji" aria-hidden="true">🧭</span> Mappa</a>
        </div>
    </header>

    <div class="wiki-layout">
        <aside id="wiki-sidebar" aria-labelledby="wiki-index-heading">
            <h2 id="wiki-index-heading">Indice della Wiki</h2>
            <label for="wiki-search-input" class="sr-only">Cerca nella Wiki</label>
            <input type="search" id="wiki-search-input" placeholder="Cerca una voce…">
            <nav id="wiki-nav-list" aria-label="Voci della Wiki"></nav>
        </aside>
        <main class="wiki-main">
            <p id="wiki-loading" role="status">Caricamento della voce…</p>
            <article id="wiki-article-container" hidden>
                <div class="wiki-article-meta">
                    <span id="article-category-badge" class="status-tag"></span>
                    <span id="article-updated-date" class="muted"></span>
                </div>
                <div id="wiki-markdown-body" class="wiki-prose"></div>
                <section class="sources-card" aria-labelledby="wiki-sources-heading">
                    <h2 id="wiki-sources-heading"><span class="emoji" aria-hidden="true">📚</span> Fonti e riferimenti</h2>
                    <div id="sources-list"></div>
                </section>
                <nav class="wiki-pagination" aria-label="Voci adiacenti">
                    <button type="button" id="btn-prev-article" class="ui-button"><span class="emoji" aria-hidden="true">⬅️</span><span><small>Precedente</small><strong id="prev-article-title"></strong></span></button>
                    <button type="button" id="btn-next-article" class="ui-button"><span><small>Successiva</small><strong id="next-article-title"></strong></span><span class="emoji" aria-hidden="true">➡️</span></button>
                </nav>
            </article>
        </main>
    </div>
    <footer class="wiki-footer">
        <p><strong>Osservatorio civico indipendente.</strong> Documentazione tecnica e divulgativa a scopo civico e informativo. Geo Fibra non è affiliato a FiberCop, Telecom Italia, Open Fiber, Fastweb o al Comune di Collesalvetti.</p>
    </footer>

    <!-- Embedded Articles Fallback Data -->
    <script src="wiki/articles_data.js"></script>

    <!-- Wiki Engine Logic -->
    <script>
        (function() {
            let catalog = [];
            let currentSlug = '';

            const sidebar = document.getElementById('wiki-sidebar');
            const btnToggle = document.getElementById('btn-toggle-sidebar');
            const navList = document.getElementById('wiki-nav-list');
            const searchInput = document.getElementById('wiki-search-input');
            const loadingEl = document.getElementById('wiki-loading');
            const articleCont = document.getElementById('wiki-article-container');
            const markdownBody = document.getElementById('wiki-markdown-body');
            const categoryBadge = document.getElementById('article-category-badge');
            const updatedDate = document.getElementById('article-updated-date');
            const sourcesList = document.getElementById('sources-list');
            const btnPrev = document.getElementById('btn-prev-article');
            const btnNext = document.getElementById('btn-next-article');
            const prevTitle = document.getElementById('prev-article-title');
            const nextTitle = document.getElementById('next-article-title');

            function toggleSidebar(open) {
                btnToggle.setAttribute('aria-expanded', String(open));
                sidebar.classList.toggle('is-open', open);
                if (open) searchInput.focus();
            }

            btnToggle.addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('is-open')));
            sidebar.addEventListener('keydown', event => {
                if (event.key === 'Escape' && btnToggle.offsetWidth) {
                    toggleSidebar(false);
                    btnToggle.focus();
                }
            });

            // Carica catalogo
            function initCatalog() {
                if (window.WIKI_CATALOG && Array.isArray(window.WIKI_CATALOG)) {
                    catalog = window.WIKI_CATALOG;
                    renderNav(catalog);
                    loadCurrentRoute();
                } else {
                    fetch('wiki/index.json')
                        .then(r => r.json())
                        .then(data => {
                            catalog = data;
                            renderNav(catalog);
                            loadCurrentRoute();
                        })
                        .catch(err => {
                            console.error('Errore caricamento index.json:', err);
                        });
                }
            }

            // Renderizza elenco navigazione
            function renderNav(items) {
                navList.replaceChildren();
                for (const item of items) {
                    const link = document.createElement('a');
                    link.href = '#' + item.slug;
                    link.className = 'wiki-nav-item';
                    link.dataset.slug = item.slug;
                    link.textContent = item.title;
                    if (item.slug === currentSlug) link.setAttribute('aria-current', 'page');
                    link.addEventListener('click', () => {
                        toggleSidebar(false);
                        if (item.slug === currentSlug) focusArticle();
                    });
                    navList.append(link);
                }
                if (!items.length) navList.textContent = 'Nessuna voce trovata.';
            }

            function focusArticle() {
                const heading = markdownBody.querySelector('h1');
                if (heading) {
                    heading.tabIndex = -1;
                    heading.focus({ preventScroll: true });
                }
            }

            // Filtro ricerca
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase().trim();
                    const filtered = catalog.filter(c => 
                        c.title.toLowerCase().includes(term) || 
                        c.summary.toLowerCase().includes(term) ||
                        c.category.toLowerCase().includes(term)
                    );
                    renderNav(filtered);
                });
            }

            // Parsing semplice front matter YAML
            function parseFrontMatter(rawMarkdown) {
                if (!rawMarkdown.startsWith('---')) {
                    return { meta: {}, content: rawMarkdown };
                }
                const endIndex = rawMarkdown.indexOf('\n---', 3);
                if (endIndex === -1) {
                    return { meta: {}, content: rawMarkdown };
                }
                const yamlBlock = rawMarkdown.substring(3, endIndex).trim();
                const content = rawMarkdown.substring(endIndex + 4).trim();

                const meta = {};
                const lines = yamlBlock.split('\n');
                let inSourcesList = false;
                let currentSource = null;
                meta.sources = [];

                lines.forEach(line => {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('title:')) {
                        meta.title = trimmed.replace('title:', '').trim().replace(/^["']|["']$/g, '');
                    } else if (trimmed.startsWith('summary:')) {
                        meta.summary = trimmed.replace('summary:', '').trim().replace(/^["']|["']$/g, '');
                    } else if (trimmed.startsWith('updated:')) {
                        meta.updated = trimmed.replace('updated:', '').trim().replace(/^["']|["']$/g, '');
                    } else if (trimmed.startsWith('sources:')) {
                        inSourcesList = true;
                    } else if (inSourcesList) {
                        if (trimmed.startsWith('- id:')) {
                            if (currentSource) meta.sources.push(currentSource);
                            currentSource = { id: trimmed.replace('- id:', '').trim().replace(/^["']|["']$/g, '') };
                        } else if (currentSource) {
                            if (trimmed.startsWith('title:')) {
                                currentSource.title = trimmed.replace('title:', '').trim().replace(/^["']|["']$/g, '');
                            } else if (trimmed.startsWith('url:')) {
                                currentSource.url = trimmed.replace('url:', '').trim().replace(/^["']|["']$/g, '');
                            } else if (trimmed.startsWith('type:')) {
                                currentSource.type = trimmed.replace('type:', '').trim().replace(/^["']|["']$/g, '');
                            } else if (trimmed.startsWith('note:')) {
                                currentSource.note = trimmed.replace('note:', '').trim().replace(/^["']|["']$/g, '');
                            }
                        }
                    }
                });
                if (currentSource) meta.sources.push(currentSource);

                return { meta, content };
            }

            // Carica articolo
            function loadArticle(slug, focusOnLoad = false) {
                currentSlug = slug;
                loadingEl.textContent = 'Caricamento della voce…';
                loadingEl.hidden = false;
                articleCont.hidden = true;

                for (const link of navList.querySelectorAll('.wiki-nav-item')) {
                    if (link.dataset.slug === slug) link.setAttribute('aria-current', 'page');
                    else link.removeAttribute('aria-current');
                }

                // Funzione ausiliaria di rendering
                function displayContent(rawMarkdown) {
                    const parsed = parseFrontMatter(rawMarkdown);
                    const meta = parsed.meta;
                    const catItem = catalog.find(c => c.slug === slug) || {};

                    categoryBadge.innerText = catItem.category || 'GUIDA TECNICA';
                    updatedDate.innerText = 'Aggiornato al ' + (meta.updated || '04/10/2026');

                    // Markdown rendering tramite marked
                    if (window.marked) {
                        markdownBody.innerHTML = marked.parse(parsed.content);

                        // Avvolgi automaticamente tutte le tabelle in un div .table-wrapper per lo scroll su mobile
                        markdownBody.querySelectorAll('table').forEach(table => {
                            if (!table.parentElement.classList.contains('table-wrapper')) {
                                const wrapper = document.createElement('div');
                                wrapper.className = 'table-wrapper';
                                table.parentNode.insertBefore(wrapper, table);
                                wrapper.appendChild(table);
                            }
                        });
                    } else {
                        markdownBody.innerText = parsed.content;
                    }

                    // Render Fonti
                    sourcesList.innerHTML = '';
                    if (meta.sources && meta.sources.length > 0) {
                        meta.sources.forEach(s => {
                            const row = document.createElement('div');
                            row.className = 'wiki-source';
                            const description = document.createElement('div');
                            const badge = document.createElement('span');
                            badge.className = 'status-tag';
                            badge.textContent = s.type || 'Fonte';
                            const title = document.createElement('strong');
                            title.textContent = s.title;
                            description.append(badge, ' ', title);
                            if (s.note) {
                                const note = document.createElement('p');
                                note.textContent = s.note;
                                description.append(note);
                            }
                            const link = document.createElement('a');
                            link.className = 'ui-button';
                            link.href = s.url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            link.textContent = 'Consulta ↗';
                            link.setAttribute('aria-label', 'Consulta ' + s.title);
                            row.append(description, link);
                            sourcesList.appendChild(row);
                        });
                    } else {
                        sourcesList.innerHTML = 'Riferimenti normativi e documentazione generale.';
                    }

                    // Aggiorna navigazione Prec/Succ
                    const currentIndex = catalog.findIndex(c => c.slug === slug);
                    if (currentIndex > 0) {
                        const prev = catalog[currentIndex - 1];
                        btnPrev.hidden = false;
                        prevTitle.innerText = prev.title;
                        btnPrev.onclick = () => window.location.hash = '#' + prev.slug;
                    } else {
                        btnPrev.hidden = true;
                    }

                    if (currentIndex < catalog.length - 1) {
                        const next = catalog[currentIndex + 1];
                        btnNext.hidden = false;
                        nextTitle.innerText = next.title;
                        btnNext.onclick = () => window.location.hash = '#' + next.slug;
                    } else {
                        btnNext.hidden = true;
                    }

                    loadingEl.hidden = true;
                    articleCont.hidden = false;
                    window.scrollTo(0, 0);
                    if (focusOnLoad) focusArticle();
                }

                // Verifica prima nei dati precaricati (fallback file://), altrimenti fetch
                if (window.WIKI_ARTICLES_DATA && window.WIKI_ARTICLES_DATA[slug]) {
                    displayContent(window.WIKI_ARTICLES_DATA[slug]);
                } else {
                    fetch(`wiki/${slug}.md`)
                        .then(r => {
                            if (!r.ok) throw new Error('HTTP ' + r.status);
                            return r.text();
                        })
                        .then(text => displayContent(text))
                        .catch(err => {
                            console.error('Errore fetch markdown:', err);
                            loadingEl.textContent = 'Impossibile caricare la voce richiesta.';
                        });
                }
            }

            function loadCurrentRoute(focusOnLoad = false) {
                const hash = window.location.hash.replace('#', '').trim();
                const target = catalog.find(c => c.slug === hash);
                if (target) {
                    loadArticle(target.slug, focusOnLoad);
                } else if (catalog.length > 0) {
                    window.history.replaceState(null, '', '#' + catalog[0].slug);
                    loadArticle(catalog[0].slug, focusOnLoad);
                }
            }

            window.addEventListener('hashchange', () => loadCurrentRoute(true));

            // Inizializzazione
            initCatalog();
        })();
    </script>
</body>
</html>
